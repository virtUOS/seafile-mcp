services:
  seafile-mcp:
    build: .
    restart: unless-stopped
    environment:
      # The one required setting. Deployment-fixed on purpose: letting a caller
      # choose the upstream would let them harvest tokens via a host they control.
      SEAFILE_SERVER_URL: ${SEAFILE_SERVER_URL:?set SEAFILE_SERVER_URL in .env}
      SEAFILE_MCP_MODE: ${SEAFILE_MCP_MODE:-safe_write}
      SEAFILE_MCP_MAX_UPLOAD_MB: ${SEAFILE_MCP_MAX_UPLOAD_MB:-50}
      SEAFILE_MCP_MAX_DELETE_ITEMS: ${SEAFILE_MCP_MAX_DELETE_ITEMS:-50}
      SEAFILE_MCP_ALLOWED_EMAIL_DOMAINS: ${SEAFILE_MCP_ALLOWED_EMAIL_DOMAINS:-}
      SEAFILE_MCP_ENABLE_SEARCH: ${SEAFILE_MCP_ENABLE_SEARCH:-}


      SEAFILE_MCP_PDF_PREVIEW_THRESHOLD_PAGES: ${SEAFILE_MCP_PDF_PREVIEW_THRESHOLD_PAGES:-15}
      SEAFILE_MCP_PPTX_PREVIEW_THRESHOLD_SLIDES: ${SEAFILE_MCP_PPTX_PREVIEW_THRESHOLD_SLIDES:-20}
      SEAFILE_MCP_XLSX_PREVIEW_THRESHOLD_SHEETS: ${SEAFILE_MCP_XLSX_PREVIEW_THRESHOLD_SHEETS:-5}
      # Size limits. max_file_read_kb caps the *text* a caller gets back;
      # max_download_mb caps the bytes held in memory to produce it, which is a
      # separate concern with a wider blast radius since one process serves
      # every user.
      SEAFILE_MCP_MAX_FILE_READ_KB: ${SEAFILE_MCP_MAX_FILE_READ_KB:-512}
      SEAFILE_MCP_MAX_DOWNLOAD_MB: ${SEAFILE_MCP_MAX_DOWNLOAD_MB:-30}
      # Image reads. max_image_edge_px/max_image_mb bound what lands in the
      # model's context, not what this server holds — a tool result goes
      # straight into the context window. Set IMAGE_READS=false for a client
      # that cannot render image blocks or a model with no vision.
      SEAFILE_MCP_MAX_IMAGE_EDGE_PX: ${SEAFILE_MCP_MAX_IMAGE_EDGE_PX:-1568}
      SEAFILE_MCP_MAX_IMAGE_MB: ${SEAFILE_MCP_MAX_IMAGE_MB:-10}
      SEAFILE_MCP_IMAGE_READS: ${SEAFILE_MCP_IMAGE_READS:-true}
      SEAFILE_MCP_MUTATION_RATE_LIMIT: ${SEAFILE_MCP_MUTATION_RATE_LIMIT:-30}
      SEAFILE_MCP_REQUEST_TIMEOUT_S: ${SEAFILE_MCP_REQUEST_TIMEOUT_S:-30}
    # No `ports:` — the only way in is through Caddy.
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes so issued TLS certificates survive a restart; without
      # these you will re-request certificates and can hit rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [seafile-mcp]
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
